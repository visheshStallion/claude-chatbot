<title>Stallion Concierge</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
  :root{
    --navy-950:#081227;
    --navy-900:#0d1b3e;
    --navy-700:#1b2f5e;
    --navy-500:#33518f;
    --gold-500:#b8912f;
    --gold-300:#d9b869;

    --bg: #e9edf5;
    --surface: #ffffff;
    --surface-sunken: #f2f4f9;
    --border: #dde3ee;
    --text: #182238;
    --text-muted: #5b6478;
    --text-on-navy: #f4f6fb;
    --text-on-navy-muted: #a9b4d1;

    --bubble-user-bg: var(--navy-900);
    --bubble-user-text: #ffffff;
    --bubble-bot-bg: var(--surface-sunken);
    --bubble-bot-text: var(--text);

    --focus-ring: var(--navy-500);
    --shadow: 0 24px 60px rgba(8, 18, 39, 0.22);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #060b18;
      --surface: #101a30;
      --surface-sunken: #182642;
      --border: #26324e;
      --text: #e7ebf5;
      --text-muted: #98a2c0;
      --text-on-navy: #f4f6fb;
      --text-on-navy-muted: #a9b4d1;

      --bubble-user-bg: #2a4494;
      --bubble-user-text: #ffffff;
      --bubble-bot-bg: var(--surface-sunken);
      --bubble-bot-text: var(--text);

      --focus-ring: var(--gold-300);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"]{
    --bg: #060b18;
    --surface: #101a30;
    --surface-sunken: #182642;
    --border: #26324e;
    --text: #e7ebf5;
    --text-muted: #98a2c0;
    --text-on-navy: #f4f6fb;
    --text-on-navy-muted: #a9b4d1;

    --bubble-user-bg: #2a4494;
    --bubble-user-text: #ffffff;
    --bubble-bot-bg: var(--surface-sunken);
    --bubble-bot-text: var(--text);

    --focus-ring: var(--gold-300);
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Libre Franklin', system-ui, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding: 32px 16px;
  }

  .card{
    width:100%;
    max-width:720px;
    height: min(760px, 88vh);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .card__header{
    background: linear-gradient(160deg, var(--navy-900), var(--navy-950));
    color: var(--text-on-navy);
    padding: 22px 26px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-shrink:0;
  }

  .card__mark{
    width:38px;
    height:38px;
    border-radius:10px;
    background: linear-gradient(150deg, var(--gold-300), var(--gold-500));
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:18px;
    color: var(--navy-950);
  }

  .card__title{
    font-family:'Source Serif 4', serif;
    font-size:19px;
    font-weight:600;
    line-height:1.2;
  }

  .card__subtitle{
    font-size:10px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    color: var(--text-on-navy-muted);
    margin-top:3px;
  }

  .thread{
    flex:1;
    overflow-y:auto;
    padding: 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background: var(--surface);
  }

  .thread::-webkit-scrollbar{ width:8px; }
  .thread::-webkit-scrollbar-thumb{ background: var(--border); border-radius:8px; }

  .empty{
    margin:auto;
    text-align:center;
    color: var(--text-muted);
    max-width: 300px;
  }

  .empty__mark{
    width:52px; height:52px;
    margin:0 auto 16px;
    border-radius:14px;
    background: var(--surface-sunken);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:'Source Serif 4', serif;
    font-size:22px;
    color: var(--navy-700);
  }

  .empty p{ font-size:14px; line-height:1.6; }
  .empty strong{ color: var(--text); font-weight:600; }

  .row{
    display:flex;
    animation: rise .25s ease;
  }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .bubble{
    max-width:76%;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 14px;
    line-height:1.55;
    white-space: pre-wrap;
  }

  .row.user .bubble{
    background: var(--bubble-user-bg);
    color: var(--bubble-user-text);
    border-bottom-right-radius:4px;
  }

  .row.bot .bubble{
    background: var(--bubble-bot-bg);
    color: var(--bubble-bot-text);
    border: 1px solid var(--border);
    border-bottom-left-radius:4px;
  }

  .row.error .bubble{
    background: transparent;
    border: 1px solid #c94b4b;
    color: #c94b4b;
  }

  .typing{
    display:flex;
    gap:4px;
    padding: 13px 15px;
    background: var(--bubble-bot-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    border-bottom-left-radius:4px;
    width:fit-content;
  }

  .typing span{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--text-muted);
    animation: pulse 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:.18s; }
  .typing span:nth-child(3){ animation-delay:.36s; }

  @keyframes pulse{
    0%, 60%, 100%{ opacity:.35; }
    30%{ opacity:1; }
  }

  .composer{
    flex-shrink:0;
    border-top:1px solid var(--border);
    background: var(--surface-sunken);
    padding: 14px;
    display:flex;
    gap:10px;
  }

  .composer input{
    flex:1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size:14px;
  }

  .composer input:focus{
    outline:none;
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus-ring) 20%, transparent);
  }

  .composer input::placeholder{ color: var(--text-muted); }

  button{
    border:none;
    cursor:pointer;
    font-family:'Libre Franklin', sans-serif;
    font-weight:700;
    font-size:10.5px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    transition: background .15s ease, color .15s ease, opacity .15s ease;
  }

  .btn-send{
    padding:0 24px;
    border-radius:24px;
    background: var(--navy-900);
    color:#fff;
  }
  .btn-send:hover{ background: var(--navy-700); }
  .btn-send:disabled{ opacity:.5; cursor:default; }

  .btn-clear{
    padding:0 16px;
    border-radius:24px;
    background:transparent;
    color: var(--text-muted);
    border:1.5px solid var(--border);
  }
  .btn-clear:hover{ color:#c94b4b; border-color:#c94b4b; }

  button:focus-visible,
  input:focus-visible{
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .row, .typing span{ animation: none; }
  }

  @media (max-width: 480px){
    .bubble{ max-width:88%; }
    body{ padding:0; }
    .card{ height:100vh; max-width:100%; border-radius:0; }
  }
</style>

<div class="card">
  <header class="card__header">
    <div class="card__mark">S</div>
    <div>
      <div class="card__title">Stallion Concierge</div>
      <div class="card__subtitle">Powered by Stallion AI</div>
    </div>
  </header>

  <div class="thread" id="thread">
    <div class="empty" id="emptyState">
      <div class="empty__mark">S</div>
      <p><strong>Welcome to Stallion Concierge.</strong><br>Ask a question to start the conversation.</p>
    </div>
  </div>

  <form class="composer" id="composer">
    <input
      type="text"
      id="messageInput"
      placeholder="Type your message here…"
      autocomplete="off"
      maxlength="2000"
    />
    <button type="submit" class="btn-send" id="sendBtn">Send</button>
    <button type="button" class="btn-clear" id="clearBtn">Clear</button>
  </form>
</div>

<script>
  const HISTORY_KEY = 'chatbot.history';
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('emptyState');
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  let history = [];

  function escapeHtml(text){
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function clearEmptyState(){
    if (emptyState.isConnected) emptyState.remove();
  }

  function addMessage(content, role){
    clearEmptyState();
    const row = document.createElement('div');
    row.className = `row ${role}`;
    row.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }

  function showTyping(){
    clearEmptyState();
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    row.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }

  function hideTyping(){
    document.getElementById('typingRow')?.remove();
  }

  function saveHistory(){
    try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
    catch(e){ console.log('Could not save history:', e); }
  }

  function loadHistory(){
    try{
      const stored = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      if (Array.isArray(stored) && stored.length){
        history = stored;
        history.forEach(m => addMessage(m.content, m.role === 'user' ? 'user' : 'bot'));
      }
    }catch(e){ console.log('Could not load history:', e); }
  }

  async function sendMessage(message){
    addMessage(message, 'user');
    showTyping();
    sendBtn.disabled = true;

    try{
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history })
      });
      const data = await response.json();
      hideTyping();

      if (response.ok){
        addMessage(data.response, 'bot');
        history.push({ role: 'user', content: message });
        history.push({ role: 'assistant', content: data.response });
        saveHistory();
      } else {
        addMessage(data.error || 'Something went wrong.', 'error');
      }
    }catch(err){
      hideTyping();
      addMessage(err.message, 'error');
    }finally{
      sendBtn.disabled = false;
    }
  }

  document.getElementById('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    input.focus();
    sendMessage(message);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('Clear the conversation history?')) return;
    history = [];
    saveHistory();
    thread.innerHTML = '';
    thread.appendChild(emptyState);
  });

  loadHistory();
</script>
